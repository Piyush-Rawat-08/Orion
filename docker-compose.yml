services:
  falkordb:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6  # FalkorDB 6.0.2, the build Orion is tested on
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3000}:3000"
    environment:
      # Algorithms on the full graph and epoch rebuilds need more than the 1 s default timeout.
      FALKORDB_ARGS: "TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 120000 RESULTSET_SIZE 100000"
    volumes:
      - orion-falkordb:/var/lib/falkordb/data
    mem_limit: 1g

  # `docker compose --profile full up` runs everything: FalkorDB, the API and the web app.
  api:
    build: ./backend
    profiles: ["full"]
    depends_on: [falkordb]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ORION_LLM: ${ORION_LLM:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ORION_SECRET: ${ORION_SECRET:-change-me-for-anything-public}
      ORION_CORS: ${ORION_CORS:-http://localhost:3001}
    ports:
      - "127.0.0.1:8100:8100"
    mem_limit: 800m

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8100}
    profiles: ["full"]
    depends_on: [api]
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 600m

volumes:
  orion-falkordb:
