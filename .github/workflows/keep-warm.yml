# Render's free plan puts the API to sleep after 15 minutes without a request, and the first visitor after that waits
# about a minute. Judging runs through the deadline week, so a request every ten minutes keeps it awake.
name: keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://orion-api-tk3u.onrender.com/api/health
